<!doctype html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./output.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class=" bg-gray-900">

  <div id="main_div" class="items-center mt-20">

    <div  class="text-start flex justify-center mb-2">
      <input type="text" placeholder="0" id="display" class=" border  rounded-2xl p-10 text-right pointer-events-none text-white">
    </div>

    <div id="calculaor" class="flex justify-center">

      <div id="btns">
        <div>
          <button
            class="px-6 py-4   border  hover:bg-white hover:text-black  text-white  bg-black rounded-2xl m-0.5 ">A</button>
          <button
            class="px-6 py-4   border  hover:bg-white hover:text-black  text-white  bg-black rounded-2xl m-0.5  ">D</button>
          <button
            class="px-6 py-4   border  hover:bg-white hover:text-black  text-white  bg-black rounded-2xl m-0.5  ">%</button>
          <button
            class="px-6 py-4   border  hover:bg-white hover:text-black  text-white  bg-black rounded-2xl m-0.3">+</button>
        </div>

        <div>
          <button
            class="px-6 py-4   border  hover:bg-white hover:text-black  text-white  bg-black rounded-2xl m-0.5  ">7</button>
          <button
            class="px-6 py-4   border  hover:bg-white hover:text-black  text-white  bg-black rounded-2xl m-0.5  ">8</button>
          <button
            class="px-6 py-4   border  hover:bg-white hover:text-black  text-white  bg-black rounded-2xl m-0.5 ml-2  ">9</button>
          <button
            class="px-6 py-4   border  hover:bg-white hover:text-black  text-white  bg-black rounded-2xl m-0.5  w-[60px]">-</button>
        </div>

        <div>
          <button
            class="px-6 py-4   border  hover:bg-white hover:text-black  text-white  bg-black rounded-2xl m-0.5  ">4</button>
          <button
            class="px-6 py-4   border  hover:bg-white hover:text-black  text-white  bg-black rounded-2xl m-0.5  ">5
          </button>
          <button
            class="px-6 py-4   border  hover:bg-white hover:text-black  text-white  bg-black rounded-2xl m-0.5 ml-2 ">6</button>
          <button
            class="px-6 py-4   border  hover:bg-white hover:text-black  text-white  bg-black rounded-2xl m-0.5  w-[60px]">*</button>
        </div>
        <div>
          <button
            class="px-6 py-4   border  hover:bg-white hover:text-black  text-white  bg-black rounded-2xl m-0.5  ">3</button>
          <button
            class="px-6 py-4   border  hover:bg-white hover:text-black  text-white  bg-black rounded-2xl m-0.5  ">2</button>
          <button
            class="px-6 py-4   border  hover:bg-white hover:text-black  text-white  bg-black rounded-2xl m-0.5 ml-2 ">1</button>
          <button
            class="px-6 py-4   border  hover:bg-white hover:text-black  text-white  bg-black rounded-2xl m-0.5  w-[60px]">/</button>
        </div>
        <div>
          <button
            class="px-6 py-4   border  hover:bg-white hover:text-black  text-white  bg-black rounded-2xl m-0.5  ">0</button>
          <button
            class="px-6 py-4   border  hover:bg-white hover:text-black  text-white  bg-black rounded-2xl m-0.5  ">.</button>
          <button
            class="px-6 py-4   border  hover:bg-white hover:text-black  text-white  bg-black rounded-2xl m-0.5  w-[140px]">=</button>
        </div>

      </div>



    </div>

  </div>
  <script src="app.js"></script>
</body>

</html>
